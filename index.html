<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>realvirtual Web Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #9a9a9a; }
    #app { width: 100%; height: 100%; }
    #react-root { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }

    /* --- Loading Overlay --- */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #1a1a1a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }
    #loading-overlay.visible {
      display: flex;
    }
    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo-wrap {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .loader-logo {
      width: 120px;
      height: 120px;
      animation: logo-pulse 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(233, 64, 120, 0.6));
    }

    /* Orbiting dot for a sense of motion */
    .orbit-ring {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 1px solid rgba(233, 64, 120, 0.15);
    }
    .orbit-dot {
      position: absolute;
      inset: -30px;
      animation: orbit-spin 1.5s linear infinite;
    }
    .orbit-dot::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #e94078;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(233, 64, 120, 0.8), -8px 0 6px rgba(233, 64, 120, 0.4), -16px 0 4px rgba(233, 64, 120, 0.2);
    }

    .loader-text {
      margin-top: 32px;
      color: #888;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .loader-model-name {
      margin-top: 8px;
      color: #4fc3f7;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }

    /* Progress bar */
    .loader-progress-track {
      margin-top: 20px;
      width: 200px;
      height: 3px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-progress-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #e94078, #ff6b9d);
      border-radius: 2px;
      animation: progress-sweep 1.8s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(233, 64, 120, 0.6)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 30px rgba(233, 64, 120, 0.9)); }
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes progress-sweep {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loader-logo-wrap">
      <div class="orbit-ring"></div>
      <div class="orbit-dot"></div>
      <img class="loader-logo" src="/logo.png" alt="realvirtual" />
    </div>
    <div class="loader-text">realvirtual Web Viewer Loading</div>
    <div class="loader-model-name" id="loading-model-name"></div>
    <div class="loader-progress-track"><div class="loader-progress-bar"></div></div>
  </div>

  <div id="react-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
